<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93C"/>
      <stop offset="50%" stop-color="#FF9E4A"/>
      <stop offset="100%" stop-color="#FF7E62"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E22"/>
      <stop offset="100%" stop-color="#080D0F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="8"/>

  <!-- Inner Amber Glow Badge -->
  <rect x="52" y="52" width="408" height="408" rx="96" fill="url(#aGrad)" filter="url(#glow)"/>

  <!-- Bold 'A' Monogram Graphic -->
  <g fill="#080D0F" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="280">
    <text x="256" y="348" text-anchor="middle" dominant-baseline="central">A</text>
  </g>

  <!-- Subtle Cyan Accent Dot -->
  <circle cx="396" cy="116" r="15" fill="#5FD4E0"/>
</svg>
